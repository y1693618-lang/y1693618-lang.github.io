<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#0B0C0F}img{max-width:100%}[hidden]{display:none!important}</style><meta charset="utf-8">
<title>結晶洞窟</title>
<script>
/* Web fonts — on the website only.
   Inside the iOS app this page is read from the app itself and must not
   reach out to anyone on launch, so the fonts are simply not asked for;
   the system fonts named after them in --font-* take their place.
   The app is recognised by the message handlers it installs before the
   page loads. */
(function(){
  try{ if(window.webkit && window.webkit.messageHandlers) return; }catch(e){}
  var h = document.head;
  function add(rel, href, cors){
    var l = document.createElement('link');
    l.rel = rel; l.href = href;
    if(cors) l.crossOrigin = '';
    h.appendChild(l);
  }
  add('preconnect', 'https://fonts.googleapis.com');
  add('preconnect', 'https://fonts.gstatic.com', true);
  add('stylesheet', 'https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Chivo+Mono:wght@400;600&display=swap');
})();
</script>
<style>
  :root{
    /* palette — replaced at runtime by the chosen skin */
    --bg:#0B1016; --bg-deep:#070B0F; --bg-top:#1A2634;
    --panel:#161F2A; --panel-2:#1F2A37;
    --line:#3B4C5C; --line-soft:#2C3A47;
    --ink:#F0F5FA; --ink-dim:#C2D0DC; --ink-faint:#9BAEBE;
    --cyan:#7FE6E0; --gold:#F2C673; --amethyst:#C29CF2; --alert:#FF9BAE;

    /* type scale — multiplied by the reader's text-size choice */
    --fs:1;
    --t-11:calc(11.5px * var(--fs));
    --t-12:calc(12.5px * var(--fs));
    --t-13:calc(13.5px * var(--fs));
    --t-14:calc(14.5px * var(--fs));
    --t-15:calc(15.5px * var(--fs));
    --t-17:calc(17px * var(--fs));
    --t-19:calc(19px * var(--fs));
    --t-22:calc(22px * var(--fs));

    --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Noto Sans SC","Noto Sans KR","Microsoft YaHei","Malgun Gothic",system-ui,sans-serif;
    --font-display:"Zen Antique",Georgia,"Songti SC","Apple SD Gothic Neo",serif;
    --font-num:"Chivo Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:dark;
  }
  /* Vietnamese letters such as ầ or ở are missing from the two Zen web
     fonts, so each of them would be drawn from a different font in the
     middle of a word. Vietnamese uses the system fonts throughout. */
  html[lang="vi"]{
    --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
    --font-display:Georgia,"Times New Roman","Noto Serif",serif;
  }
  /* Chinese text must not borrow the Japanese fonts first in the list:
     they contain the same characters but in Japanese shapes. */
  html[lang="zh-Hans"]{
    --font-body:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --font-display:"Songti SC","Noto Serif SC","PingFang SC",serif;
  }
  html[lang="zh-Hant"]{
    --font-body:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    --font-display:"Songti TC","Noto Serif TC","PingFang TC",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 80% at 50% 0%, var(--bg-top) 0%, var(--bg) 42%, var(--bg-deep) 100%);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:var(--t-14);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button,textarea,select{font-family:inherit;color:inherit}

  .app{height:100%;display:flex;flex-direction:column;padding:0 16px;max-width:1220px;margin:0 auto;gap:10px}

  /* ---------- header ---------- */
  .bar{
    flex:0 0 auto;padding-block:14px 10px;display:flex;align-items:flex-end;
    justify-content:space-between;gap:14px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;
  }
  .count-wrap{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 8rem}
  .eyebrow{font-size:var(--t-11);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .count{
    font-family:var(--font-num);font-weight:600;
    font-size:calc(clamp(25px,6.2vw,40px) * var(--fs));
    line-height:1.08;font-variant-numeric:tabular-nums;
    overflow-wrap:anywhere;max-width:100%;
  }
  .count.long{font-size:calc(clamp(19px,4.6vw,30px) * var(--fs))}
  .count.xlong{font-size:calc(clamp(15px,3.6vw,23px) * var(--fs))}
  .count .unit{font-size:.48em;color:var(--ink-dim);margin-left:.34em;letter-spacing:.04em;font-family:var(--font-body);font-weight:500}
  .rate{font-family:var(--font-num);font-size:var(--t-13);color:var(--cyan);
    font-variant-numeric:tabular-nums;font-weight:600;overflow-wrap:anywhere;max-width:100%}
  .rate .sep{color:var(--ink-faint);margin:0 .45em}
  .rate .boost{color:var(--gold)}
  /* flex:1 1 auto matters. Words differ in length by language, and at the
     larger text sizes this block drops onto its own row. As flex:0 0 auto it
     kept a narrow box and its right-aligned label spilled out of it — the
     seam name looked stranded in mid-air. Growing to fill the row keeps the
     three lines stacked against one edge whether it wraps or not. */
  /* Both halves of the header ask for a small share and then grow into
     whatever is left, so neither one's natural width can push the other
     onto a second row. With flex:1 1 auto the seam block claimed the width
     of its longest line — "Siguiente: Amatista (600)" at the largest text
     size — and wrapped below the count in Spanish, English, Korean and
     Chinese while Japanese happened to fit. A basis in rem, not content,
     is what makes the row behave the same in every language. */
  .stage-badge{text-align:right;display:flex;flex-direction:column;gap:5px;
    align-items:flex-end;flex:1 1 9rem;min-width:0;max-width:22rem}
  .stage-name{font-family:var(--font-display);font-size:var(--t-19);letter-spacing:.05em;
    color:var(--stage-color,var(--amethyst));line-height:1.15;max-width:100%;overflow-wrap:anywhere}
  .meter{width:clamp(96px,30vw,168px);max-width:100%;height:6px;border-radius:99px;background:var(--line-soft);border:1px solid var(--line);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--stage-color,var(--amethyst));transition:width .35s ease}
  .meter-label{font-size:var(--t-11);color:var(--ink-dim);letter-spacing:.02em;font-weight:500;
    max-width:100%;overflow-wrap:anywhere}

  /* ---------- layout ---------- */
  .main{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(210px,1.05fr) minmax(0,1fr);gap:10px}
  @media (min-width:860px){ .main{grid-template-rows:none;grid-template-columns:1fr 400px;gap:22px} }

  /* ---------- stage ---------- */
  .stage{
    position:relative;min-height:0;border-radius:18px;overflow:hidden;display:flex;
    background:linear-gradient(180deg,var(--stage-top,#0E1620) 0%,var(--stage-bot,#0A0F16) 100%);
    border:1px solid var(--line-soft);
  }
  #cv{display:block;width:100%;height:100%;touch-action:manipulation}
  .stage{-webkit-user-select:none;user-select:none}
  .tap-btn,.qty,.tab,.item,.mini,.opt{touch-action:manipulation}
  .tap-btn{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;padding:0;cursor:default;-webkit-tap-highlight-color:transparent}
  .tap-btn.over{cursor:pointer}
  .tap-btn:focus-visible{outline:3px solid var(--cyan);outline-offset:-5px;border-radius:18px}
  .hint{position:absolute;left:12px;right:12px;bottom:42px;text-align:center;font-size:var(--t-12);color:var(--ink-dim);letter-spacing:.08em;pointer-events:none;transition:opacity .5s ease;font-weight:500}
  .depth{position:absolute;bottom:14px;left:14px;font-family:var(--font-num);font-size:var(--t-11);color:var(--ink-dim);letter-spacing:.04em;pointer-events:none;font-weight:600}

  .stage-tools{position:absolute;top:9px;right:9px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:99px;
    padding:8px 13px;font-size:var(--t-12);color:var(--ink-dim);cursor:pointer;
    font-weight:500;transition:color .15s ease,border-color .15s ease;min-height:36px;
  }
  .chip:hover{color:var(--ink);border-color:var(--ink-faint)}
  .chip:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .chip svg{display:block;flex:0 0 auto}
  .chip[aria-expanded="true"]{color:var(--ink);border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}


  .paused-veil{
    position:absolute;inset:0;z-index:2;display:grid;place-content:center;gap:12px;justify-items:center;
    background:color-mix(in srgb, var(--bg-deep) 80%, transparent);
    text-align:center;padding:18px;
  }
  .paused-veil b{font-family:var(--font-display);font-size:var(--t-22);font-weight:400;letter-spacing:.12em}
  .paused-veil span{font-size:var(--t-13);color:var(--ink-dim);line-height:1.8;max-width:34ch}
  .veil-btn{
    margin-top:2px;padding:12px 26px;border-radius:99px;cursor:pointer;min-height:46px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font-size:var(--t-14);letter-spacing:.06em;font-weight:500;
  }
  .veil-btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .veil-btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

  /* ---------- panels ---------- */
  .shop{min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
  /* Five tabs, and at the largest text size a word like "ボーナス" is wider
     than a fifth of a phone. Rather than clip it, the row is allowed to fall
     into two, and each tab asks for a share small enough that it only does so
     when it really must. */
  .tabs{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .tab{
    /* one step down from the body size: five labels then sit on one line
       each at the three smaller text settings, and a wrapped two-line label
       is harder to read than a slightly smaller one-line label */
    font-size:var(--t-12);
    /* em, not rem: the share each tab asks for grows with the reader's text
       size, so the row breaks in two exactly when five words stop fitting —
       instead of staying in one row and snapping "Rebirth" into "Rebirt/h". */
    /* centred as a block, so a label that does take two lines still sits
       level with its one-line neighbours instead of riding up */
    display:flex;align-items:center;justify-content:center;text-align:center;
    /* never narrower than its longest word: with seventeen languages some
       labels are single long words (Перерождение, Odrodzenie), and a word
       must not be cut or spill over the edge. The row wraps instead. */
    flex:1 1 4.6em;min-width:min-content;
    /* when the row does break, the leftover tab is half a row at most,
       centred, rather than one enormous button spanning the screen */
    max-width:calc(50% - 3px);
    background:transparent;border:1px solid var(--line-soft);border-radius:10px;
    padding:11px 4px;letter-spacing:.03em;color:var(--ink-dim);
    cursor:pointer;transition:all .18s ease;font-weight:500;min-height:48px;
    line-height:1.3;
  }
  .tab[aria-selected="true"]{background:var(--panel-2);color:var(--ink);border-color:var(--line);font-weight:700;box-shadow:inset 0 -3px 0 var(--cyan)}
  .tab:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  /* The "rebirth is ready" dot used to sit in the line of text. Once a label
     was long enough — "Renacer" at the Large setting — the dot no longer fit
     beside it and wrapped onto a second line, which made that one tab two
     lines tall and left its word sitting higher than its neighbours. Lifted
     out of the flow into the corner, it cannot push anything around. */
  .tab{position:relative}
  .tab .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;
    border-radius:99px;background:var(--gold);opacity:0;transition:opacity .2s}
  .tab.ready .dot{opacity:1}

  .list{
    flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;
    display:flex;flex-direction:column;gap:7px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .list::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

  .item{
    display:flex;flex-wrap:wrap;align-items:center;gap:11px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--accent,var(--line));
    border-radius:12px;padding:11px 13px;cursor:pointer;
    transition:background .15s ease,border-color .15s ease,transform .08s ease;
  }
  .item:hover:not(:disabled){background:var(--panel-2)}
  .item:active:not(:disabled){transform:translateY(1px)}
  .item:disabled{cursor:default;opacity:.55}
  .item:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .item.afford{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
  .glyph{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;background:color-mix(in srgb,var(--ink) 8%, transparent);flex:0 0 auto}
  .item-mid{flex:1 1 140px;min-width:0}
  .item-name{font-size:var(--t-15);font-weight:700;line-height:1.35;display:block}
  /* Long compound words (Sterrenstofsmidse, Erinnerungseinstellungen) may
     be hyphenated where the language allows, and only broken when a
     single word is wider than the whole line. Never cut off. */
  .item-name,.item-desc,.opt,.mini,.big-btn,h3,.stat-row span,.chip,.card p,.howto li{
    overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
  .item-name b{font-family:var(--font-num);font-weight:600;font-size:var(--t-12);color:var(--ink-dim);margin-left:7px}
  .item-desc{font-size:var(--t-12);color:var(--ink-dim);line-height:1.55;margin-top:2px;display:block}
  .item-right{flex:0 1 auto;min-width:0;max-width:100%;margin-left:auto;text-align:right}
  .price{font-family:var(--font-num);font-size:var(--t-14);font-variant-numeric:tabular-nums;color:var(--ink-dim);font-weight:600;display:block;overflow-wrap:anywhere}
  .item.afford .price{color:var(--cyan)}
  .item.afford .price::before{content:"▸ ";font-family:var(--font-body)}
  .yield{font-size:var(--t-11);color:var(--ink-faint);font-family:var(--font-num);margin-top:3px;display:block;font-weight:600;overflow-wrap:anywhere}

  /* a quiet heading above a group of rows */
  .sec{display:flex;flex-direction:column;gap:3px;padding:12px 3px 1px}
  .sec b{font-size:var(--t-13);font-weight:700;color:var(--ink);letter-spacing:.04em}
  .sec span{font-size:var(--t-11);color:var(--ink-faint);line-height:1.65}

  /* bulk-buy selector above the building list */
  .qty-row{
    display:flex;gap:6px;flex:0 0 auto;
    position:sticky;top:0;z-index:2;
    padding-bottom:7px;
    background:linear-gradient(180deg,var(--bg) 64%,transparent);
  }
  .qty{
    flex:1;min-width:0;min-height:44px;padding:10px 4px;border-radius:9px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line-soft);color:var(--ink-faint);
    font-family:var(--font-num);font-size:var(--t-13);font-weight:600;transition:all .15s ease;
  }
  .qty:hover{color:var(--ink-dim)}
  /* The chosen amount must read without colour: a doubled frame and the
     same thick bar along the bottom that marks the open tab. Checked in
     greyscale, where colour alone left all three looking alike. */
  .qty[aria-pressed="true"]{background:var(--panel-2);border-color:var(--cyan);color:var(--ink);
    font-weight:800;box-shadow:inset 0 0 0 1px var(--cyan),inset 0 -4px 0 var(--cyan)}
  .qty:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

  /* milestone: every 10 copies doubles a building's output */
  .mult{
    font-style:normal;font-family:var(--font-num);font-size:var(--t-11);font-weight:600;
    color:var(--gold);margin-left:7px;padding:1px 6px;border-radius:5px;
    border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
  }
  .ms{display:flex;align-items:center;gap:8px;margin-top:6px}
  .ms-bar{flex:1 1 auto;height:4px;border-radius:99px;background:var(--line-soft);overflow:hidden;max-width:110px}
  .ms-bar i{display:block;height:100%;background:var(--accent,var(--cyan));transition:width .2s ease}
  .ms-txt{font-size:var(--t-11);color:var(--ink-faint);font-weight:600;white-space:nowrap}

  /* first-run guide */
  .welcome{
    position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;
    background:color-mix(in srgb,var(--bg-deep) 88%, transparent);
  }
  .welcome-card{
    width:min(460px,100%);max-height:100%;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:26px 24px calc(22px + env(safe-area-inset-bottom,0px));
    box-shadow:0 26px 70px rgba(0,0,0,.6);
  }
  .welcome-card h2{
    margin:0 0 10px;font-family:var(--font-display);font-weight:400;
    font-size:calc(clamp(24px,6.5vw,32px) * var(--fs));letter-spacing:.05em;color:var(--ink);
  }
  .welcome-card .lead{margin:0 0 18px;font-size:var(--t-14);color:var(--ink-dim);line-height:1.8}
  .welcome-card ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px}
  .welcome-card li{display:flex;gap:12px;align-items:flex-start;font-size:var(--t-14);color:var(--ink);line-height:1.7}
  .welcome-card li span.n{
    flex:0 0 auto;width:26px;height:26px;border-radius:99px;display:grid;place-items:center;
    background:var(--cyan);color:var(--bg-deep);font-family:var(--font-num);
    font-size:var(--t-12);font-weight:600;margin-top:2px;
  }
  .welcome-card .more{margin:18px 0 0;font-size:var(--t-12);color:var(--ink-faint);line-height:1.7}

  .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:15px 16px;font-size:var(--t-13);color:var(--ink-dim);line-height:1.8}
  .card h3{margin:0 0 10px;font-family:var(--font-display);font-size:var(--t-17);color:var(--ink);letter-spacing:.04em;font-weight:400}
  .card p{margin:0 0 10px}
  .card p:last-child{margin-bottom:0}
  .card b{color:var(--ink);font-weight:700}
  .card em{color:var(--gold);font-style:normal;font-weight:700}
  .card .quiet{color:var(--ink-faint);font-size:var(--t-12)}

  /* rules */
  .rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
  .rules li{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-soft)}
  .rules li:first-child{border-top:0;padding-top:2px}
  .rules .rn{
    flex:0 0 auto;font-family:var(--font-num);font-size:var(--t-12);font-weight:600;color:var(--bg);
    background:var(--ink-faint);border-radius:99px;width:24px;height:24px;
    display:grid;place-items:center;margin-top:3px;
  }
  .rules .rt{display:block;color:var(--ink);font-weight:700;font-size:var(--t-14);line-height:1.5;margin-bottom:3px}
  .rules .rb{display:block;font-size:var(--t-13);line-height:1.85;color:var(--ink-dim)}

  .big-btn{
    width:100%;margin-top:12px;padding:14px;border-radius:10px;cursor:pointer;min-height:50px;
    background:color-mix(in srgb,var(--gold) 20%, var(--panel));
    border:1px solid var(--gold);color:var(--gold);
    font-size:var(--t-14);letter-spacing:.05em;font-weight:700;transition:filter .15s ease;
  }
  .big-btn:hover:not(:disabled){filter:brightness(1.2)}
  .big-btn:disabled{opacity:.45;cursor:default;filter:none}
  .big-btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

  .stat-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:var(--t-13)}
  .stat-row:last-of-type{border-bottom:0}
  .stat-row span:last-child{font-family:var(--font-num);color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}

  /* flex rather than a fixed grid, so an option can grow to fit a long
     word (Crepúsculo, Alacakaranlık) and the row wraps instead */
  .opt-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .opt-grid .opt{flex:1 1 104px;min-width:min-content}
  .opt{
    display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:9px;cursor:pointer;min-height:44px;
    background:var(--panel-2);border:1px solid var(--line-soft);font-size:var(--t-13);color:var(--ink-dim);
    transition:all .15s ease;font-weight:500;text-align:left;
  }
  .opt:hover{color:var(--ink)}
  .opt[aria-pressed="true"]{border-color:var(--cyan);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--cyan)}
  .opt[aria-pressed="true"] .tickbox::after{content:"✓";font-size:var(--t-12);color:var(--cyan);font-weight:700}
  .opt:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .sw{width:18px;height:18px;border-radius:5px;flex:0 0 auto;border:1px solid var(--ink-faint)}
  .tickbox{width:18px;height:18px;border-radius:4px;flex:0 0 auto;border:1px solid var(--ink-faint);display:grid;place-items:center}

      const inApp = !!(window.webkit && window.webkit.messageHandlers

  const coreMult = () => 1 + S.cores*0.02;

    ctx.fillStyle = fg; ctx.fillRect(0,0,W,H);

    if(!reduce) drawDust(dt, col);

    ctx.beginPath();
    ctx.ellipse(cx, baseY+6, unit*0.62, unit*0.14, 0, 0, Math.PI*2);
    ctx.fillStyle = skin.rock; ctx.fill();
    ctx.strokeStyle = 'hsla('+col.h+','+col.s+'%,'+shardL(col.l)+'%,'+(skin.dark?0.20:0.14)+')';
    ctx.lineWidth = 1.4; ctx.stroke();

    const frozen = S.paused;
    const breathe = (reduce||frozen)?0:Math.sin(tick*1.4)*0.012;
    const pop = frozen ? 0 : pulse*(reduce ? 0.05 : 0.18);
    const scale = 1+breathe+pop;

    ctx.globalAlpha = frozen ? 0.4 : 1;
    for(let i=0;i<SHARDS.length;i++){
      const sh = SHARDS[i], target = i<visible ? 1 : 0;
      sh.s += (target-sh.s)*Math.min(1,dt*4);
      if(sh.s < 0.01) continue;
      drawShard(cx+sh.x*unit*0.52, baseY, sh.ang, unit*sh.len*sh.s*scale,
                unit*sh.wid*sh.s*(1+pop*0.55), col, i);
    }
    ctx.globalAlpha = 1;
    drawVignette();
    if(orb) drawOrb(dt);

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt;
      if(p.fall) p.vy += 420*dt;
      const a = Math.max(0,p.life/p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c || ('hsl('+p.h+','+col.s+'%,'+shardL(Math.min(92,col.l+14))+'%)');
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a+0.6,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.textAlign = 'center';
    const popSize = Math.round(16*FS[fsIndex]);
    for(let i=pops.length-1;i>=0;i--){
      const q = pops[i];
      q.life -= dt;
      if(q.life <= 0){ pops.splice(i,1); continue; }
      q.y -= 46*dt;
      ctx.globalAlpha = Math.min(1,q.life/0.5);
      ctx.font = '600 '+popSize+'px "Chivo Mono", monospace';
      ctx.lineWidth = 3;
      ctx.strokeStyle = skin.dark ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.7)';
      ctx.strokeText(q.txt, q.x, q.y);
      ctx.fillStyle = q.c || ('hsl('+col.h+','+Math.min(90,col.s+20)+'%,'+shardL(Math.min(90,col.l+12))+'%)');
      ctx.fillText(q.txt, q.x, q.y);
      ctx.globalAlpha = 1;
    }
    if(pulse > 0) pulse = Math.max(0, pulse - dt*3.2);
  }

  function drawShard(x,y,ang,len,wid,col,i){
    const Lv = shardL(col.l);
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    const w = wid;
    const g = ctx.createLinearGradient(0,0,0,-len);
    g.addColorStop(0,   'hsla('+col.h+','+col.s+'%,'+Math.max(8,Lv-52)+'%,1)');
    g.addColorStop(0.55,'hsla('+col.h+','+col.s+'%,'+Math.max(16,Lv-26)+'%,1)');
    g.addColorStop(1,   'hsla('+col.h+','+Math.min(100,col.s+12)+'%,'+Math.min(96,Lv+8)+'%,1)');
    ctx.beginPath();
    ctx.moveTo(-w,0); ctx.lineTo(-w,-len*0.70); ctx.lineTo(0,-len); ctx.lineTo(w,-len*0.70); ctx.lineTo(w,0);
    ctx.closePath();
    ctx.shadowColor = 'hsla('+col.h+','+col.s+'%,'+Lv+'%,'+(skin.dark?0.5:0.3)+')';
    ctx.shadowBlur = 22;
    ctx.fillStyle = g; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(-w*0.18,0); ctx.lineTo(-w*0.18,-len*0.72); ctx.lineTo(0,-len);
    ctx.lineTo(w*0.30,-len*0.70); ctx.lineTo(w*0.30,0); ctx.closePath();
    ctx.fillStyle = 'hsla('+col.h+','+col.s+'%,'+Math.min(98,Lv+16)+'%,'+(0.16+(i%3)*0.05)+')';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-w,0); ctx.lineTo(-w,-len*0.70); ctx.lineTo(0,-len);
    ctx.strokeStyle = 'hsla('+col.h+',90%,'+(skin.dark?92:46)+'%,.4)';
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  }

  function drawOrb(dt){
    const o = orb;
    o.life -= dt;
    if(o.life <= 0){ orb = null; orbTimer = nextOrbGap(); return; }
    o.x += o.vx*dt;
    /* With reduced motion the orb crosses in a straight line. Bobbing on top
       of the sideways drift is motion on two axes at once — the kind the
       setting exists to spare people. */
    o.y = reduce ? o.baseY : o.baseY + Math.sin(tick*1.6+o.phase)*18;
    if(o.x < -60 || o.x > W+60){ orb = null; orbTimer = nextOrbGap(); return; }
    const fade = Math.min(1,o.life/1.2);
    const r = o.r*(reduce?1:(1+Math.sin(tick*5)*0.07));
    ctx.save();
    ctx.globalAlpha = fade;
    const g = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,r*3.4);
    g.addColorStop(0,o.color+'CC'); g.addColorStop(0.28,o.color+'55'); g.addColorStop(1,o.color+'00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x,o.y,r*3.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(o.x,o.y,r,0,Math.PI*2);
    ctx.fillStyle = o.color; ctx.fill();
    ctx.lineWidth = 2.6;
    ctx.strokeStyle = skin.dark ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.75)';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(o.x,o.y,r*2.0,tick*2.2,tick*2.2+Math.PI*1.35);
    ctx.strokeStyle = o.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  /* The whole point of this game is that the feedback is visual, so the
     burst has to be unmistakable — and it has to survive a reader who has
     asked for less motion. With reduced motion the shards appear already
     scattered and simply fade, instead of flying. */
  function burst(x,y,amount,color){
    const col = stageColor(stageIndex(),tick);
    const n = reduce ? 9 : Math.min(32, 16+Math.floor(Math.log10(amount+1)*3));
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = reduce ? 0 : 120+Math.random()*250;
      const off = reduce ? 12+Math.random()*30 : 0;
      particles.push({
        x: x+Math.cos(a)*off, y: y+Math.sin(a)*off,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-120,
        r: 2.6+Math.random()*4.4, life:.6+Math.random()*.5, max:1.1,
        fall: !reduce,
        h: col.h+(Math.random()*30-15), c: color||null});
    }
  }

  /* ================================================================
     events / popups
     ================================================================ */

  function spawnOrb(){
    const id = EVENT_IDS[Math.floor(Math.random()*EVENT_IDS.length)];
    const fromLeft = Math.random() < 0.5;
    orb = {id, color:EVENT_COLOR[id], r:13,
      x: fromLeft ? -40 : W+40, baseY: H*(0.20+Math.random()*0.34), y:0,
      vx:(fromLeft?1:-1)*(W+120)/ORB_CROSS, phase:Math.random()*6.28, life:ORB_LIFE};
    orb.y = orb.baseY;
  }

  function claimOrb(){
    if(!orb) return;
    const id = orb.id, x = orb.x, y = orb.y, color = orb.color;
    const t = L.events[id];
    let sub = t[1];
    S.events++;
    if(id === 'echo'){
      boost = {mult:5, until:Date.now()+ECHO_MS};
    }else{
      const gain = Math.max(tapPower()*(id==='lode'?60:120), baseRate()*(id==='lode'?90:190), 100);
      S.c += gain; S.total += gain; S.grand += gain;
      sub += '<br>' + L.gainLine(fmt(gain));
    }
    Native.haptic('orb');
    burst(x,y,9e9,color);
    pops.push({x, y:y-10, life:1.3, txt:'!', c:color});
    showBig(L.evKicker, t[0], sub, color);
    orb = null; orbTimer = nextOrbGap();
    refresh(); save();
  }

      '<i class="mult" data-mult hidden></i></span>'+

      '<span class="item-right"><span class="price" data-price>0</span><span class="yield" data-yield></span></span>';

      price:b.querySelector('[data-price]'), yld:b.querySelector('[data-yield]'),
      bar:b.querySelector('[data-bar]'), badge:b.querySelector('[data-mult]'),
      ms:b.querySelector('[data-ms]')};

  const ownedOf = (def, kind) => kind==='tap' ? S.taps[def.id] : S.gens[def.id];
  /* how many this row would buy right now, given the ×1 / ×10 / ×MAX setting */
  function qtyFor(def, kind){
    const owned = ownedOf(def, kind);
    if(buyQty === 'max') return maxAffordable(def, owned, S.c);
    return buyQty;
  }

  function buy(def, kind){
    if(S.paused) return;

    const k = qtyFor(def, kind);
    if(k < 1) return;

  /* the crystal itself is the only place that mines — an ellipse
     drawn around the shard cluster, with a floor size for small screens */
  function onCrystal(x, y){
    const unit = Math.min(W*0.42, H*0.40);
    const cx = W/2, ecy = H*0.78 - unit*0.38;
    const rx = Math.max(54, unit*0.64), ry = Math.max(54, unit*0.62);
    const dx = (x-cx)/rx, dy = (y-ecy)/ry;
    return dx*dx + dy*dy <= 1;
  }
  const onOrb = (x,y) => !!orb && Math.hypot(orb.x-x, orb.y-y) < Math.max(46, orb.r*3.4);

  function mine(clientX, clientY, keyboard){
    if(S.paused) return;
    const r = cv.getBoundingClientRect();
    const x = clientX != null ? clientX-r.left : W/2;
    const y = clientY != null ? clientY-r.top  : H*0.5;
    if(orb && (keyboard || onOrb(x,y))){ claimOrb(); return; }
    if(!keyboard && !onCrystal(x,y)) return;   // tapping the empty cave does nothing
    const gain = tapPower();
    S.c += gain; S.total += gain; S.grand += gain; S.clicks++;
    pulse = 1;
    Native.haptic('tap');
    burst(x,y,gain);
    pops.push({x, y:y-8, life:1.0, txt:'+'+fmt(gain)});
    if(S.clicks === 6) $('hint').style.opacity = '0';
  }

  function doReset(){
    const gain = coresOnReset();
    if(gain <= 0) return;
    const opened = atSeal();          // standing at the deepest open seam?
    S.cores += gain; S.resets++; S.coreBonus = 0;
    if(opened) S.loops = (S.loops||0) + 1;
    S.c = 0; S.total = 0;

  const fsRoot = () => document.documentElement;

      : '<path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/>';

  /* ---------- save code ---------- */
  /* Short save code: every value as a base-36 integer, joined with "-",
     plus a 2-character checksum.  Roughly a tenth the length of the
     base64 JSON it replaces, and still readable enough to retype. */
  const B36 = n => Math.max(0, Math.floor(+n || 0)).toString(36);
  function sumOf(body){
    let h = 7;
    for(let i=0;i<body.length;i++) h = (h*31 + body.charCodeAt(i)) % 1296;
    return h.toString(36).padStart(2,'0');
  }
  function encode(){
    const v = [Math.round(S.c), Math.round(S.total), Math.round(S.grand), S.cores,
      S.taps.pick, S.taps.glove].concat(GENS.map(g => S.gens[g.id]))
      .concat([S.clicks, S.resets, S.events, S.paused?1:0, S.loops||0, Math.round(S.t/1000)]);
    const body = v.map(B36).join('-');
    return 'CC2-' + body + '-' + sumOf(body);
  }
  function decode(str){
    const s = String(str||'').trim().replace(/\s+/g,'');
    const ver = /^CC([12])-/i.exec(s);
    if(ver){
      const v2 = ver[1] === '2';
      const p = s.split('-');
      const values = 6 + GENS.length + (v2 ? 6 : 5);
      if(p.length !== values + 2) return null;        // prefix + values + checksum
      const body = p.slice(1, -1).join('-');
      if(sumOf(body) !== p[p.length-1].toLowerCase()) return null;
      for(let i=1;i<p.length-1;i++) if(!Number.isFinite(parseInt(p[i],36))) return null;
      const n = i => parseInt(p[i+1], 36);
      const g0 = 6, tail = 6 + GENS.length;
      const d = {c:n(0), total:n(1), grand:n(2), cores:n(3),
        taps:{pick:n(4), glove:n(5)}, gens:{},
        clicks:n(tail), resets:n(tail+1), events:n(tail+2),
        paused: n(tail+3) === 1,
        loops: v2 ? n(tail+4) : 0,
        t: n(tail + (v2 ? 5 : 4)) * 1000};
      GENS.forEach((g,i) => d.gens[g.id] = n(g0+i));
      return d;
    }
    // older, longer base64 codes still load
    try{ return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; }
  }

  function copyFrom(ta, label){
    ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0,99999);
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    ta.setAttribute('readonly','');
    if(!ok && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value)
        .then(() => toast(L.copied(label)))
        .catch(() => toast(L.copyManual));
      return;
    }
    toast(ok ? L.copied(label) : L.copyManual);
  }

  /* ---------- rewards ---------- */

  const DAILY_MAX = 10;
  const todayKey = () => { const d = new Date();
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
  /* rolls the counter over the moment the local date changes */
  function dailyLeft(){
    const k = todayKey();
    if(S.adDay !== k){ S.adDay = k; S.adUsed = 0; }
    return Math.max(0, DAILY_MAX - (S.adUsed||0));
  }
  function untilMidnight(){
    const n = new Date(), m = new Date(n);
    m.setHours(24,0,0,0);
    return m - n;
  }
  const cdLeft = id => Math.max(0, ((S.adcd && S.adcd[id]) || 0) - Date.now());
  function mmss(ms){
    const t = Math.ceil(ms/1000);
    return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
  }
  /* hours only appear once there are hours to show */
  function hms(ms){
    const t = Math.ceil(ms/1000), h = Math.floor(t/3600);
    if(h <= 0) return mmss(ms);
    return h + ':' + String(Math.floor((t%3600)/60)).padStart(2,'0') +
           ':' + String(t%60).padStart(2,'0');
  }
  function rewardReady(def){
    if(S.paused || Ads.busy) return false;
    if(dailyLeft() <= 0) return false;
    if(cdLeft(def.id) > 0) return false;
    return def.ok ? def.ok() : true;
  }

  function grantReward(id){
    const t = L.rewards[id];
    let sub = '';
    if(id === 'skip'){
      const gain = baseRate() * 8*3600 * 0.5;    // the same rate as being away
      S.c += gain; S.total += gain; S.grand += gain;
      sub = L.rwGot.skip(fmt(gain));
    }else if(id === 'boost'){
      boost = {mult: Math.max(2, boostMult()),
               until: Math.max(boost.until, Date.now() + 30*60*1000)};
      sub = L.rwGot.boost;
    }else if(id === 'orb'){
      if(!orb && W > 80) spawnOrb();
      orbTimer = nextOrbGap();
      sub = L.rwGot.orb;
    }else if(id === 'core'){
      S.coreBonus = 0.25;
      sub = L.rwGot.core;
    }
    S.adcd = S.adcd || {};
    dailyLeft();                       // rolls the day over if needed
    S.adUsed = (S.adUsed||0) + 1;
    const def = REWARDS.find(r => r.id === id);
    S.adcd[id] = Date.now() + def.cd*1000;
    save(); refresh();
    showBig(L.rwKicker, t[0], sub, '#7FE6E0');
  }

  let lastStage = -1;
  function refresh(){
    const r = rate(), b = boostMult();
    const cTxt = fmt(S.c);
    const cEl = $('count');
    cEl.textContent = cTxt;
    /* step the headline down as the digits pile up, so it never runs off */
    cEl.classList.toggle('long',  cTxt.length > 11 && cTxt.length <= 16);
    cEl.classList.toggle('xlong', cTxt.length > 16);
    const v = fmtRate(r);
    /* 毎秒 12 in Japanese, Chinese and Korean; 12 per sec elsewhere */
    let html = langDef().rateFirst ? L.perSec+' '+v : v+' '+L.perSec;
    if(S.cores) html += '<span class="sep">|</span>'+L.coreMult+' ×'+fmtMult();
    if(b > 1){
      const ms = boost.until - Date.now();
      html += '<span class="sep">|</span><span class="boost">'+L.resonance+' ×'+b+' '+
        (ms > 60000 ? L.rwWait(mmss(ms)) : L.remain(Math.ceil(ms/1000)))+'</span>';
    }
    $('rate').innerHTML = html;

    const si = stageIndex(), st = STAGES[si], col = stageColor(si,tick);
    $('badge').style.setProperty('--stage-color',
      'hsl('+Math.round(col.h)+','+col.s+'%,'+(skin.dark?Math.min(80,col.l):Math.max(28,col.l-34))+'%)');
    $('stageName').textContent = L.stages[si];
    const prog = stageProgress();
    $('meterFill').style.width = (prog*100).toFixed(1)+'%';
    $('meter').setAttribute('aria-valuenow', Math.round(prog*100));
    $('meterLabel').textContent =
      si >= STAGES.length-1 ? L.deepest
      : si+1 >= seamsOpen() ? L.sealed
      : L.nextIs(L.stages[si+1], fmt(STAGES[si+1].at));
    $('depth').textContent = L.depth(num(depthNow()));

    if(si !== lastStage){
      if(lastStage >= 0){
        Native.haptic('seam');
        showBig(L.newVeinKicker, L.stages[si], L.newVeinSub(num(depthNow())),
          'hsl('+Math.round(col.h)+','+col.s+'%,'+(skin.dark?Math.min(74,col.l):Math.max(30,col.l-30))+'%)');
      }
      lastStage = si;
    }

    for(const key in rows){
      const row = rows[key], d = row.def;
      const owned = row.kind==='tap' ? S.taps[d.id] : S.gens[d.id];
      if(d.need && S.grand < d.need && owned === 0){ row.el.hidden = true; continue; }
      row.el.hidden = false;
      const k = Math.max(1, qtyFor(d, row.kind));
      const cost = costN(d, owned, k);
      const can = S.c >= cost && !S.paused && (buyQty !== 'max' || qtyFor(d,row.kind) >= 1);
      row.el.disabled = !can;
      row.el.classList.toggle('afford', can);
      row.own.textContent = owned ? '×'+owned : '';
      row.price.textContent = (k > 1 ? '×'+k+'  ' : '') + fmt(cost);

      if(row.kind === 'gen'){
        const m = msMult(owned);
        row.badge.hidden = m <= 1;
        row.badge.textContent = '×'+m;
        const into = owned % MS_STEP;
        row.bar.style.width = (owned === 0 ? 0 : (into/MS_STEP)*100)+'%';
        row.ms.textContent = L.msNext(MS_STEP - into);
        row.yld.textContent = '+'+fmtRate((owned ? genOutput(d) : d.rate)*coreMult()*b)+L.perSecShort;
      }else{
        row.yld.textContent = d.id === 'pick'
          ? L.mine+' '+fmtRate(tapPower()) : L.pctOf(S.taps.glove+1);
      }
    }

    for(const k in rwRows){
      const r = rwRows[k], left = cdLeft(k);
      const can = rewardReady(r.def);
      r.el.disabled = !can;
      r.el.classList.toggle('afford', can);
      r.state.textContent = dailyLeft() <= 0 ? L.rwEmpty
        : left > 0 ? L.rwWait(mmss(left)) : L.rwWatch;
    }
    const rwl = $('rw-left');
    if(rwl){
      const n = dailyLeft();
      rwl.textContent = n > 0 ? L.rwOf(n, DAILY_MAX) : L.rwResetIn(hms(untilMidnight()));
    }

    const gain = coresOnReset();
    const set = (id,v) => { const el = $(id); if(el) el.textContent = v; };
    set('st-cores', S.cores);
    set('st-mult', '×'+fmtMult());
    set('st-gain', gain);
    set('st-total', fmt(S.total));
    set('st-grand', fmt(S.grand));
    set('st-clicks', num(S.clicks));
    set('st-events', S.events);
    set('st-resets', S.resets);
    set('st-loops', seamsOpen()+' / '+STAGES.length);
    set('st-stage', L.stages[si]);
    const rb = $('btnReset');
    if(rb){
      rb.disabled = gain <= 0;
      rb.textContent = gain > 0 ? L.doRebirth(gain) : L.rebirthLocked;
    }
    tabs.core.classList.toggle('ready', gain > 0);
  }

  /* ================================================================
     loop / boot
     ================================================================ */

  let last = performance.now(), acc = 0, saveAcc = 0;
  function frame(now){
    let dt = (now-last)/1000; last = now;
    if(dt > 0.25) dt = 0.25;
    if(!S.paused){
      const r = rate();
      if(r > 0){ const g = r*dt; S.c += g; S.total += g; S.grand += g; }
      if(!orb){ orbTimer -= dt; if(orbTimer <= 0 && W > 80) spawnOrb(); }
    }
    draw(dt);
    acc += dt; if(acc > 0.1){ acc = 0; refresh(); }
    saveAcc += dt; if(saveAcc > 10){ saveAcc = 0; save(); }
    requestAnimationFrame(frame);
  }

  /* The language comes from the device and nowhere else; the game has no
     language switch of its own.

     In the iOS app, the app hands over the language iOS picked for it
     (window.CC_DEVICE_LANG). iOS makes that choice from the person's own
     list of preferred languages, including Settings › Crystal Cavern ›
     Language, so a French iPhone gets French and a Taiwanese iPhone gets
     Traditional Chinese.
     In a browser, the browser's list of languages is walked in order and
     the first one this game has is used.
     A language the game does not have falls back to English. */
  function tagToLang(tag){
    const t = String(tag || '').toLowerCase().replace('_', '-');
    if(!t) return null;
    if(t.startsWith('zh')){
      return /hant|-tw|-hk|-mo/.test(t) ? 'zht' : 'zh';
    }
    const base = t.split('-')[0];
    const alias = {'in':'id', 'nb':null};
    const b = (base in alias) ? alias[base] : base;
    return (b && T[b] && b !== 'zht') ? b : null;
  }
  function deviceLang(){
    const tags = [];
    try{ if(window.CC_DEVICE_LANG) tags.push(window.CC_DEVICE_LANG); }catch(e){}
    try{ (navigator.languages || []).forEach(t => tags.push(t)); }catch(e){}
    try{ if(navigator.language) tags.push(navigator.language); }catch(e){}
    for(const t of tags){
      const id = tagToLang(t);
      if(id) return id;
    }
    return 'en';
  }
  function detectLang(){
    /* 1.0 remembered a hand-picked language here. There is no picker any
       more, so the old choice is cleared rather than left to override
       the device for good. */
    try{ localStorage.removeItem('cc-lang'); localStorage.removeItem('cc-lang-v'); }catch(e){}
    return deviceLang();
  }

  function start(hot){
    langId = detectLang(); L = T[langId];
    try{ applySkin(localStorage.getItem('cc-skin') || 'cave'); }catch(e){ applySkin('cave'); }
    let fi = 1;
    try{ const v = localStorage.getItem('cc-fs'); if(v !== null) fi = +v; }catch(e){}

    if(hot && hot.state){
      Object.assign(S, hot.state);
    }else{
      const savedAt = load();
      if(savedAt && !S.paused){
        const away = Math.min((Date.now()-savedAt)/1000, 8*3600);
        const r = baseRate();
        if(away > 60 && r > 0){
          const earned = r*away*0.5;
          S.c += earned; S.total += earned; S.grand += earned;
          const mins = Math.floor(away/60);
          setTimeout(() => showBig(L.backKicker, L.backTitle,
            L.backSub(L.hm(Math.floor(mins/60), mins%60), fmt(earned)), '#7FE6E0'), 700);
        }
      }
    }

    Ads.init();
    applyStaticText();
    buildAll();
    applyFs(fi);
    if(S.clicks >= 6) $('hint').style.opacity = '0';
    resize();
    lastStage = stageIndex();
    setPaused(!!S.paused);
    refresh(); refreshShare();
    selectTab('mine');
    let seen = true;
    try{ seen = !!localStorage.getItem('cc-seen'); }catch(e){}
    if(!seen && S.grand === 0) showWelcome();
    if(Native.on) Native.privacy(false);
    requestAnimationFrame(frame);
    try{ window.claude && window.claude.hot && window.claude.hot.snapshot(() => ({state:S})); }catch(e){}
  }

  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ save(); Native.idle(); }
  });
  window.addEventListener('pagehide', () => { save(); Native.idle(); });

  try{
    if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
    else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }catch(e){ start(null); }
})();
</script>
